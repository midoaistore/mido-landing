<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <title>Mido V11 Lite — Biological Engine</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07111f; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hud { position: fixed; z-index: 2; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(680px, calc(100% - 24px)); padding: 14px 16px; border: 1px solid rgba(103, 232, 249, .24); border-radius: 14px; background: rgba(5, 15, 29, .78); box-shadow: 0 10px 40px #0005; backdrop-filter: blur(12px); }
    .brand { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; color: #e6fbff; font-size: clamp(13px, 3.5vw, 17px); font-weight: 750; letter-spacing: .02em; }
    .ar { color: #67e8f9; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .title { margin-top: 8px; color: #f0f9ff; font-size: 14px; font-weight: 700; }
    .hint { margin-top: 3px; color: #9fb6c9; font-size: 12px; }
    .controls { display: flex; gap: 8px; margin-top: 11px; }
    button { min-height: 36px; padding: 7px 14px; border: 1px solid #22d3ee77; border-radius: 9px; color: #dffaff; background: #0e749044; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    button:hover, button:focus-visible { background: #0891b277; outline: 2px solid #67e8f9; outline-offset: 2px; }
    button#reset { border-color: #a78bfa77; background: #6d28d944; }
    .footer { position: fixed; z-index: 2; right: 12px; bottom: max(10px, env(safe-area-inset-bottom)); color: #8ba3b7; font-size: 10px; letter-spacing: .08em; pointer-events: none; }
    @media (max-width: 420px) { .hud { padding: 12px; } .brand { font-size: 13px; } .ar { font-size: 11px; } }
  </style>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <header class="hud">
    <div class="brand"><span>Mido DeepSearch Biological Engine V11</span><span class="ar" lang="ar" dir="rtl">محرك ميدو للبحث العميق V11</span></div>
    <div class="title" id="stageTitle">🧬 Mido V11 Lite - 15 Organelles</div>
    <div class="hint">Click = console.log agent | Mobile 60fps</div>
    <div class="controls"><button id="explode" type="button">Explode</button><button id="reset" type="button">Reset</button></div>
  </header>
  <div class="footer">BUILD IN PUBLIC · DAY 21/30 · CAIRO · 6-INCH PHONE</div>
  
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07111f);
    scene.fog = new THREE.Fog(0x07111f, 9, 24);

    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0.8, 10.5);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xb9e8ff, 1.15));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(4, 6, 7);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x22d3ee, 1.1);
    rimLight.position.set(-5, -2, -4);
    scene.add(rimLight);

    const colors = [0x22d3ee, 0xa78bfa, 0xf472b6, 0xfacc15, 0x4ade80];
    const agents = ['TavilyScout', 'TrustRanker', 'ThesisBuilder', 'RiskChecker', 'ReportWeaver'];
    const organelles = [];
    const sphereGeometry = new THREE.SphereGeometry(0.22, 16, 16);
    const random = () => Math.random();

    for (let i = 0; i < 15; i++) {
      const ang = (i / 15) * Math.PI * 2;
      const r = 2.2 + random() * 0.8;
      const position = new THREE.Vector3(Math.cos(ang) * r, (random() - 0.5) * 2, Math.sin(ang) * r);
      const material = new THREE.MeshStandardMaterial({ color: colors[i % colors.length], roughness: 0.35, metalness: 0.12, emissive: colors[i % colors.length], emissiveIntensity: 0.08, flatShading: true });
      const mesh = new THREE.Mesh(sphereGeometry, material);
      mesh.position.copy(position);
      mesh.userData = { agent: agents[i % 5], index: i, orig: position.clone() };
      mesh.userData.radius = r;
      scene.add(mesh);
      organelles.push(mesh);
    }

    // Keep each link on its fixed indexed pair; the eight links form the blueprint scaffold.
    const linkMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
    const links = [];
    for (let i = 0; i < 8; i++) {
      const geometry = new THREE.BufferGeometry().setFromPoints([organelles[i].position, organelles[(i + 5) % 15].position]);
      const line = new THREE.Line(geometry, linkMaterial);
      scene.add(line);
      links.push({ line, a: i, b: (i + 5) % 15 });
    }

    // 300 lightweight sphere instances retain the requested individual floating motion.
    const particleGeometry = new THREE.SphereGeometry(0.018, 6, 4);
    const particleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, depthWrite: false });
    const particles = new THREE.InstancedMesh(particleGeometry, particleMaterial, 300);
    particles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const dummy = new THREE.Object3D();
    const particlePositions = [];
    const particleVels = [];
    for (let i = 0; i < 300; i++) {
      const p = new THREE.Vector3((random() - 0.5) * 12, (random() - 0.5) * 8, (random() - 0.5) * 10);
      particlePositions.push(p);
      particleVels.push(new THREE.Vector3((random() - 0.5) * 0.01, (random() - 0.5) * 0.01, (random() - 0.5) * 0.01));
      dummy.position.copy(p);
      dummy.updateMatrix();
      particles.setMatrixAt(i, dummy.matrix);
    }
    scene.add(particles);

    function annotation(text, x, y, z) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.font = 'bold 25px monospace';
      ctx.fillStyle = 'rgba(103,232,249,.9)';
      ctx.fillText(text, 8, 40);
      ctx.strokeStyle = 'rgba(103,232,249,.48)';
      ctx.beginPath(); ctx.moveTo(6, 51); ctx.lineTo(162, 51); ctx.stroke();
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false, opacity: 0.8 }));
      sprite.position.set(x, y, z);
      sprite.scale.set(1.65, 0.42, 1);
      scene.add(sprite);
    }
    annotation('R1 = 12mm', -3.2, 1.65, 0.2);
    annotation('R2 = 18mm', 1.8, -1.65, 0.3);
    annotation('V11 / 15', -0.5, 2.1, -1.2);

    let exploded = false;
    const targets = organelles.map(mesh => mesh.userData.orig.clone());
    function setExploded(value) {
      exploded = value;
      organelles.forEach((mesh, i) => {
        const orig = mesh.userData.orig;
        // Fixed angular slots plus positive radial scaling preserve order during the lerp.
        targets[i] = value ? orig.clone().multiplyScalar(3) : orig.clone();
      });
    }
    document.getElementById('explode').addEventListener('click', () => setExploded(true));
    document.getElementById('reset').addEventListener('click', () => setExploded(false));

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    function select(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(organelles, false)[0];
      if (!hit) return;
      const { agent, index } = hit.object.userData;
      console.log('Agent:', agent, 'Index:', index);
      hit.object.material.emissiveIntensity = 1.4;
      window.setTimeout(() => { hit.object.material.emissiveIntensity = 0.08; }, 240);
    }
    renderer.domElement.addEventListener('pointerdown', select, { passive: true });

    // ==========================================
    // MIDO V11 STAGE SYNC (الربط مع صفحة الهبوط)
    // ==========================================
    const stageNames = ["Source Search", "Thesis Build", "Reduce & Rank", "Risk Check", "Final Report"];
    const stageTitle = document.getElementById('stageTitle');

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'mido-stage') {
        const stage = event.data.stage;
        const isSearching = event.data.searching;

        if (isSearching && stage >= 0 && stage <= 4) {
            // تفعيل الانفجار التلقائي
            setExploded(true);
            
            // تحديث عنوان الـ HUD داخل الـ iframe
            if(stageTitle) stageTitle.textContent = `⚙️ ${stageNames[stage]}... (${stage + 1}/5)`;

            // إضاءة وتكبير الوكيل المسؤول عن المرحلة الحالية
            organelles.forEach((mesh, i) => {
                if (i % 5 === stage) {
                    mesh.material.emissiveIntensity = 1.4;
                    mesh.scale.set(1.6, 1.6, 1.6);
                } else {
                    mesh.material.emissiveIntensity = 0.02;
                    mesh.scale.set(0.8, 0.8, 0.8);
                }
            });
        } else {
            // العودة للحالة الطبيعية (بعد انتهاء البحث)
            setExploded(false);
            if(stageTitle) stageTitle.textContent = "🧬 Mido V11 Lite - 15 Organelles";
            organelles.forEach((mesh) => {
                mesh.material.emissiveIntensity = 0.08;
                mesh.scale.set(1, 1, 1);
            });
        }
      }
    });

    // ==========================================
    // ANIMATION LOOP
    // ==========================================
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.04);
      // Preserve the deterministic angular order: organelles move only along their own radial lanes.
      organelles.forEach((mesh, i) => {
        mesh.position.lerp(targets[i], 0.05);
        mesh.rotation.y += delta * 0.22;
        mesh.rotation.x += delta * 0.12;
      });
      links.forEach(({ line, a, b }) => {
        const attr = line.geometry.attributes.position;
        attr.setXYZ(0, organelles[a].position.x, organelles[a].position.y, organelles[a].position.z);
        attr.setXYZ(1, organelles[b].position.x, organelles[b].position.y, organelles[b].position.z);
        attr.needsUpdate = true;
        line.geometry.computeBoundingSphere();
      });
      for (let i = 0; i < 300; i++) {
        const p = particlePositions[i], v = particleVels[i];
        p.addScaledVector(v, delta * 60);
        if (p.x > 6) p.x = -6; else if (p.x < -6) p.x = 6;
        if (p.y > 4) p.y = -4; else if (p.y < -4) p.y = 4;
        if (p.z > 5) p.z = -5; else if (p.z < -5) p.z = 5;
        dummy.position.copy(p); dummy.updateMatrix(); particles.setMatrixAt(i, dummy.matrix);
      }
      particles.instanceMatrix.needsUpdate = true;
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    }, { passive: true });
    console.log('Loaded - 15 organelles / 300 particles / 60fps | Listening for parent stages');
  </script>
  
  <!-- MIDO V11 CTA BUTTON -->
  <a href="./" style="position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#000;padding:12px 22px;border-radius:30px;font-weight:800;text-decoration:none;z-index:10;box-shadow:0 8px 30px rgba(34,211,238,.4);font-size:13px">🚀 Try Real Search → 35s / $6 Lifetime</a>
</body>
  </html>
