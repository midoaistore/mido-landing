function getVisitorId() {

}

  }

  '</div>'+logsHtml+(isLoading?'<div class="prog"><div></div></div>':'')+'</div>';

    showBuy = true;
  } else if(msg.includes('trial_used') || msg.includes('LIMIT:trial_used')){
    finalMsg = 'التجربة المجانية اتستخدمت قبل كده (مرة واحدة لكل زائر - محمية من الخادم). للحصول على بحث غير محدود، احصل على الأداة كاملة.';
    showBuy = true;
  } else if(msg.includes('ip_limit') || msg.includes('LIMIT:ip_limit')){
    finalMsg = 'تم الوصول للحد الأقصى من التجارب من نفس الشبكة (5 في اليوم). جرب من شبكة تانية أو احصل على الأداة كاملة.';
    showBuy = true;
  } else if(msg.includes('no_sources') || msg.includes('LIMIT:no_sources')){
    finalMsg = 'مفيش مصادر كافية للسؤال ده دلوقتي. التجربة المجانية ماتحسبتش، جرب سؤال تاني أو جرب بعد دقيقة.';
    showBuy = false;
  } else if(msg.includes('llm_failed') || msg.includes('LIMIT:llm_failed')){
    finalMsg = 'حصلت مشكلة مؤقتة في النموذج. التجربة المجانية ماتحسبتش، جرب تاني بعد دقيقة.';
    showBuy = false;
  } else if(msg.includes('config_error') || msg.includes('LIMIT:config_error')){
    finalMsg = 'فيه إعداد ناقص في الخادم (مفاتيح API). التجربة ماتحسبتش، تواصل مع الدعم.';
    showBuy = false;
  } else if(msg.includes('in_flight') || msg.includes('LIMIT:in_flight')){
    finalMsg = 'البحث شغال بالفعل من نفس الزائر - استنى 60 ثانية وجرب تاني.';
    showBuy = false;
  } else if(msg.includes('rate_limited') || msg.includes('LIMIT:rate_limited')){
    finalMsg = 'طلبات كتير من نفس الشبكة في وقت قصير - استنى دقيقة وجرب تاني.';

  } else if(msg.includes('HTTP 5')){

    showBuy = false;
  } else if(msg.includes('NETWORK')){
    finalMsg = 'حصلت مشكلة شبكة مؤقتة - جرب تاني حالا - المحرك شغال.';
    showBuy = false;
  }
  return '<div class="err"><b>حصلت مشكلة:</b> '+esc(finalMsg)+(showBuy?'<br><a href="'+BUY_URL+'" target="_blank" rel="noopener noreferrer">اشتري الأداة كاملة - 299ج ←</a>':'')+'</div>';

var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
async function search(){
  var text=q.value.trim();
  if(!text||loading) return;
  loading=true; go.innerHTML='<span class="spin"></span>يبحث... V6.0'; refreshBtn();
  var done=0;
  res.innerHTML=stepsHTML(0,[],true);
  var anim=(async function(){
    for(var i=0;i<5;i++){await sleep(700);done=i+1;res.innerHTML=stepsHTML(done,[],true);}
  })();
  var outcome;
  try{
    var r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json','X-Visitor-Id':VISITOR_ID},body:JSON.stringify({query:text, visitor_id:VISITOR_ID, skill: CURRENT_SKILL})});
    if(r.status===429){
      var d429={}; try{ d429=await r.json(); }catch(e){}
      if(d429.reason==='daily_cap'){ throw new Error('LIMIT:daily_cap'); }
      else if(d429.reason==='ip_limit'){ throw new Error('LIMIT:ip_limit'); }
      else if(d429.reason==='in_flight'){ throw new Error('LIMIT:in_flight'); }
      else if(d429.reason==='rate_limited'){ throw new Error('LIMIT:rate_limited'); }
      else { throw new Error('LIMIT:trial_used'); }
    }
    if(!r.ok) throw new Error('HTTP '+r.status);
    var data=await r.json();
    if(!data.success && data.reason) throw new Error('LIMIT:'+data.reason);
    var answer=data.deep_answer||data.answer||'تم جمع المصادر.';
    var sources=data.top_sources||data.sources||data.results||[];
    var allSources=data.sources||data.results||sources;
    outcome={ok:true,answer:answer,sources:sources,allSources:allSources,logs:data.logs||[],engines:data.engines||{}};
    try{ fbq('track','Search', {search_string: text}); fbq('track','ViewContent'); }catch(e){}
  }catch(err){
    var msg = (err instanceof TypeError)?'NETWORK':String(err.message||'');
    outcome={ok:false,msg:msg};
  }
  await anim;
  if(outcome.ok){
    res.innerHTML=stepsHTML(5,outcome.logs,false)+reportHTML(outcome.answer,outcome.sources,outcome.logs,outcome.engines);
    fetchStats();
    setTimeout(function(){res.scrollIntoView({behavior:'smooth',block:'start'});},100);
    try{ fbq('track','CompleteRegistration'); }catch(e){}
  }else{
    res.innerHTML=errHTML(outcome.msg, true);
  }
  loading=false; go.innerHTML='بحث 🔍 V6.0'; refreshBtn();
}

(function(){
  var canvas=document.getElementById('spider'); if(!canvas) return; 
  var ctx=canvas.getContext('2d'); if(!ctx) return;
  var W,H,dpr;
  function resize(){W=innerWidth;H=innerHeight;dpr=devicePixelRatio||1;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);}
  resize(); addEventListener('resize',resize);
  function mkGrid(){var g=[];for(var r=0;r<4;r++)for(var c=0;c<6;c++)g.push({x:90+(c+.5)*((W-180)/6),y:120+(r+.5)*((H-180)/4)});return g;}
  var targets=mkGrid();
  var sp={x:W*.5,y:90,tx:targets[0].x,ty:targets[0].y};
  var legs=[-75,-38,38,75,105,142,-142,-105].map(function(d){var a=d*Math.PI/180;return{ang:a,fx:sp.x+Math.cos(a)*30,fy:sp.y+Math.sin(a)*30,tx:sp.x+Math.cos(a)*30,ty:sp.y+Math.sin(a)*30};});
  var moving=false,moveTimer=0,last=performance.now(),actx=null;
  function snd(){try{if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended') actx.resume().catch(function(){});var n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=2400;f.Q.value=1.4;o.type='square';o.frequency.setValueAtTime(2400,n);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.08,n+.004);g.gain.exponentialRampToValueAtTime(.0001,n+.08);o.connect(f);f.connect(g);g.connect(actx.destination);o.start(n);o.stop(n+.08);}catch(e){}}
  var L1=34,L2=34,LIM=46;
  function draw(now){
    var dt=Math.min(50,now-last);last=now;
    if(moving){moveTimer-=dt/1000;if(moveTimer<=0){moving=false;targets.shift();if(!targets.length)targets=mkGrid();sp.tx=targets[0].x;sp.ty=targets[0].y;}}
    else{var dx=sp.tx-sp.x,dy=sp.ty-sp.y,dist=Math.hypot(dx,dy);if(dist<6){moving=true;moveTimer=1;snd();}else{var spd=Math.max(200,dist*3.2+30)*dt/1000;if(spd>=dist){sp.x=sp.tx;sp.y=sp.ty;}else{sp.x+=dx/dist*spd;sp.y+=dy/dist*spd;}}}
    ctx.clearRect(0,0,W,H);
    ctx.save();ctx.strokeStyle='rgba(214,217,224,.12)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sp.x,0);ctx.lineTo(sp.x,sp.y-12);ctx.stroke();ctx.restore();
    legs.forEach(function(l,i){
      var bx=sp.x+Math.cos(l.ang)*12,by=sp.y+Math.sin(l.ang)*10,dx=l.fx-bx,dy=l.fy-by;
      var dist=Math.min(Math.hypot(dx,dy),L1+L2-.5); if(dist<.001) return;
      var ca=(dist*dist-L1*L1-L2*L2)/(2*L1*L2),an=Math.acos(Math.max(-1,Math.min(1,ca)));
      var kd=L1+L2*Math.cos(an),kh=L2*Math.sin(an),ba=Math.atan2(dy,dx)-Math.atan2(kh,kd);
      var kx=bx+Math.cos(ba)*L1,ky=by+Math.sin(ba)*L1;
      ctx.strokeStyle='#2a2f3c';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(kx,ky);ctx.lineTo(l.fx,l.fy);ctx.stroke();
      ctx.fillStyle='#0d1018';ctx.strokeStyle='#232733';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(kx,ky,2.8,0,6.2832);ctx.fill();ctx.stroke();
      ctx.fillStyle=i%2===0?'#8a90a0':'#6b7280';ctx.beginPath();ctx.arc(l.fx,l.fy,2.3,0,6.2832);ctx.fill();
    });
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(sp.x,sp.y+22,18,6,0,0,6.2832);ctx.fill();
    ctx.fillStyle='#0d1018';ctx.strokeStyle='#2c313f';ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(sp.x,sp.y+12,13,17,0,0,6.2832);ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(255,184,77,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sp.x,sp.y+2);ctx.lineTo(sp.x,sp.y+20);ctx.stroke();
    ctx.fillStyle='#151821';ctx.strokeStyle='#2c313f';ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(sp.x,sp.y-5,10.5,10.5,0,0,6.2832);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff4d9a';ctx.beginPath();ctx.arc(sp.x-3.2,sp.y-8,1.7,0,6.2832);ctx.fill();
    ctx.fillStyle='#4fe0ff';ctx.beginPath();ctx.arc(sp.x+3.2,sp.y-8,1.7,0,6.2832);ctx.fill();
    if(moving){ctx.strokeStyle='rgba(255,77,154,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(sp.x,sp.y+3,10+(1-moveTimer)*18,0,6.2832);ctx.stroke();}
    legs.forEach(function(l,i){
      var bx=sp.x+Math.cos(l.ang)*12,by=sp.y+Math.sin(l.ang)*10;
      if(Math.hypot(l.fx-bx,l.fy-by)>LIM){var td=28+(i%3)*6+Math.random()*6;l.tx=sp.x+Math.cos(l.ang)*td;l.ty=sp.y+Math.sin(l.ang)*td;}
      var dx=l.tx-l.fx,dy=l.ty-l.fy,d=Math.hypot(dx,dy);
      if(d>.5){var mv=Math.min(d,420*dt/1000);l.fx+=dx/d*mv;l.fy+=dy/d*mv;if(d>3&&mv>=d-.1&&Math.random()<.85)snd();}
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

document.querySelectorAll('a[href^="http"]').forEach(function(a){a.target='_blank';a.rel='noopener noreferrer';});
})();
