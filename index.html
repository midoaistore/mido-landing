(function(){
  // 1) put your Pixel ID here (digits only), e.g. '123456789012345'
  var PIXEL_ID = window.MIDO_PIXEL_ID || 'PUT_YOUR_PIXEL_ID_HERE';
  var WORKER = 'https://mido-tavily-proxy.midoaistore.workers.dev';

  if(on){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init',PIXEL_ID); fbq('track','PageView');

  function std(n,p){ try{ if(on) fbq('track',n,p||{}); }catch(e){} }
  function cus(n,p){ try{ if(on) fbq('trackCustom',n,p||{}); }catch(e){} }

  // anonymous visitor id (one free search per visitor is enforced by the Worker)

    if(!/^[A-Za-z0-9-]{16,64}$/.test(v)){
      v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('v-'+Math.random().toString(36).slice(2)+Date.now().toString(36)+'0000000000');

    if(url.indexOf(WORKER)!==0||!_fetch) return _fetch.apply(this,arguments);
